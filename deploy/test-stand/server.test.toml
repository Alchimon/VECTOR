# =============================================================================
# ВЕКТОР — конфигурация ТЕСТОВОГО стенда (создана скриптом setup-test-stand).
# Пути — относительно каталога стенда (ярлыки запуска переходят в него сами).
# Секретов здесь нет: строка подключения — в db.url, ключ копий — в backup.key.
# Полное описание параметров: config/vector-server.example.toml
# =============================================================================

[server]
# 127.0.0.1 — сервер доступен только с этого ПК; 0.0.0.0 — со всех ПК сети (режим --lan / -Lan).
host = "@BIND@"
port = @PORT@
tls_cert = "certs/server.pem"
tls_key  = "certs/server.key"

[database]
# SQLite — только для теста на одном стенде. Для работы — PostgreSQL или MS SQL (docs/ops/install.md).
url_file = "db.url"

[security]
# По умолчанию: пароль от 12 символов, блокировка после 5 неудачных входов на 15 минут,
# сеанс — 120 минут без активности, файл документа — до 200 МБ.

[backup]
dir = "backups"
keep = 14
