# =============================================================================
# ВЕКТОР — пример конфигурации сервера.
#
# Скопируйте в рабочий каталог (например, C:\ProgramData\Vector\vector-server.toml
# или /etc/vector/vector-server.toml) и поправьте пути.
#
# ВАЖНО: в этом файле НЕТ и НЕ ДОЛЖНО быть секретов.
#   • Строка подключения к БД (в ней пароль) — в переменной окружения или в
#     отдельном файле с правами только для учётной записи службы.
#   • Пароль первого администратора спрашивается при `vector-server init`
#     (или берётся из VECTOR_ADMIN_PASSWORD в автоматизации) — не из файла.
#   • Ключ резервных копий — отдельный файл (`vector-server gen-backup-key`).
# Сервер откажется запускаться, если найдёт `database.url` прямо в этом файле.
# =============================================================================

[server]
# Адрес прослушивания. 0.0.0.0 — все сетевые интерфейсы сервера.
host = "0.0.0.0"
port = 8443

# TLS обязателен для работы в сети. Сертификат выдаёт CA компании;
# для пилота можно создать тестовый: `vector-server dev-cert --dir ./pilot/certs --host <имя-сервера>`.
# Закрытый ключ должен быть доступен только учётной записи службы (на Linux — права 600).
tls_cert = "./pilot/certs/server.pem"
tls_key  = "./pilot/certs/server.key"

# Только для разработки на одной машине: TLS выключен, host обязан быть 127.0.0.1.
# dev_insecure_localhost = false

[database]
# Вариант 1 — переменная окружения со строкой подключения:
#   PostgreSQL: postgresql+psycopg2://vector:<пароль>@db-host:5432/vector
#   MS SQL:     mssql+pyodbc://vector:<пароль>@db-host/vector?driver=ODBC+Driver+18+for+SQL+Server&Encrypt=yes
#   SQLite (только пилот на одном месте): sqlite:///./pilot/vector.sqlite
url_env = "VECTOR_DB_URL"

# Вариант 2 — файл с одной строкой подключения (права 600 / ACL только для службы):
# url_file = "./pilot/db.url"

[security]
# Значения по умолчанию — временные предположения (журнал решений), их можно ужесточить.
# password_min_length = 12           # не меньше 8
# lockout_threshold = 5              # неудачных входов подряд до блокировки
# lockout_minutes = 15
# session_idle_minutes = 120         # сеанс без активности
# session_absolute_hours = 12        # максимальная длительность сеанса
# login_rate_per_minute_per_addr = 20
# max_file_mb = 200                  # предел размера одного файла версии документа, 1..2048 МБ (A-16).
#                                    # Передача потоковая: память от размера не зависит, но на время
#                                    # передачи файл лежит в системном каталоге временных файлов
#                                    # (TMPDIR / TEMP) — нужен запас диска.

[backup]
# Каталог для зашифрованных копий (*.vbak) и сколько последних хранить.
# Храните копии и КЛЮЧ раздельно: копия без ключа бесполезна, ключ без копии — тоже.
dir = "./pilot/backups"
keep = 14
